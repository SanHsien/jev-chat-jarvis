name: Vercel models

on:
  push:
    branches: [main]
    paths:
      - app/src/main/java/com/jev/probe/core/Prefs.kt
      - tools/check_vercel_models.py
      - .github/workflows/vercel-models.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Shipped Vercel model ids exist in the gateway catalog
        run: python tools/check_vercel_models.py
